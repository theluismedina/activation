spring.application.name=data-gen

# Audience generation (see DataGenProperties for details)
datagen.record-count=10000000
datagen.customer-count=1000
datagen.segments-per-customer=20
datagen.user-pool-size=50000000
# datagen.seed=42
datagen.output-dir=data/audiences
datagen.compression=SNAPPY
datagen.row-group-size=128MB

# Default schedule. Changes made with PUT /api/generation/schedule are saved to the state file
# and restored on restart; delete that file to go back to these values.
# Spring cron format: second minute hour day-of-month month day-of-week
datagen.schedule.cron=0 0 2 * * *
datagen.schedule.enabled=true
# datagen.schedule.zone=UTC
datagen.schedule.state-file=data/schedule.json
