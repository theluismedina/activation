plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

group = 'io.synapstream'
version = '0.0.1-SNAPSHOT'
description = 'data-gen'
jib.to.image = 'synapstream/activation/datagen'


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Parquet writer. parquet-hadoop still needs Hadoop's Configuration class on the classpath,
    // but we write through LocalOutputFile so no Hadoop FileSystem (or winutils) is involved.
    implementation 'org.apache.parquet:parquet-hadoop:1.15.2'
    implementation('org.apache.hadoop:hadoop-common:3.4.1') {
        exclude group: 'org.slf4j'
        exclude group: 'ch.qos.reload4j'
        exclude group: 'log4j'
        exclude group: 'javax.servlet'
        exclude group: 'javax.servlet.jsp'
        exclude group: 'org.eclipse.jetty'
        exclude group: 'com.sun.jersey'
        exclude group: 'com.github.pjfanning'
        exclude group: 'org.apache.zookeeper'
        exclude group: 'org.apache.curator'
        exclude group: 'org.apache.kerby'
        exclude group: 'org.apache.avro'
        exclude group: 'com.jcraft'
        exclude group: 'io.dropwizard.metrics'
        exclude group: 'io.netty'
        exclude group: 'dnsjava'
    }
    // ParquetFileReader (used to read the previous snapshot) references one MapReduce class.
    implementation('org.apache.hadoop:hadoop-mapreduce-client-core:3.4.1') { transitive = false }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
