name: CI

# Pull requests into master: build and test (the required status check).
# Pushes to master (i.e. merged PRs): build, test, then publish images.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a publish half-way; superseded PR builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Only modules that are functional are built; add others here as they become real.
      - name: Build and test
        run: ./gradlew :data-gen:build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Registry is configurable: set the repository variable IMAGE_REGISTRY (e.g. docker.io/myorg/activation)
      # and the secrets REGISTRY_USERNAME / REGISTRY_PASSWORD. Without them, images go to GHCR under this repo.
      - name: Resolve image settings
        id: image
        env:
          CONFIGURED_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          DEFAULT_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          registry="${CONFIGURED_REGISTRY:-$DEFAULT_REGISTRY}"
          registry="${registry,,}"  # registries require lowercase names
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "host=${registry%%/*}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Jib picks up these credentials from the Docker config.
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push images (amd64 + arm64)
        run: >
          ./gradlew :data-gen:jib
          -PimageRegistry=${{ steps.image.outputs.registry }}
          -Djib.to.tags=latest,${{ steps.image.outputs.sha_tag }}
          -Djib.from.platforms=linux/amd64,linux/arm64

      - name: Summary
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.image.outputs.registry }}/data-gen:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.image.outputs.registry }}/data-gen:${{ steps.image.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
