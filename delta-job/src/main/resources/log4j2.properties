# Spark is chatty at INFO; keep it to warnings and log the job itself at INFO. Logs go to stderr.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}: %m%n

logger.deltajob.name = io.synapstream.deltajob
logger.deltajob.level = info

# Expected on Windows without winutils, and in containers without native Hadoop; the job never writes through
# Hadoop's FileSystem, so neither matters.
logger.shell.name = org.apache.hadoop.util.Shell
logger.shell.level = error
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
