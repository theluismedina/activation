services:

   data-gen:
     # Published by CI on every merge to master. Override IMAGE_REGISTRY / IMAGE_TAG to use another registry or a
     # specific build (e.g. IMAGE_TAG=sha-1a2b3c4). A local `./gradlew :data-gen:jibDockerBuild` produces this same
     # name, so locally built images are used without pulling.
     image: ${IMAGE_REGISTRY:-ghcr.io/theluismedina/activation}/data-gen:${IMAGE_TAG:-latest}
     ports:
       # Control API (/api/generation). Host port defaults to 8081; override with DATAGEN_PORT.
       - "${DATAGEN_PORT:-8081}:8080"
     environment:
       # Pin paths explicitly rather than relying on the image's working directory.
       DATAGEN_OUTPUTDIR: /data/audiences
       DATAGEN_SCHEDULE_STATEFILE: /data/schedule.json
     volumes:
       - audience-data:/data

   delta-job:
     # Runs once and exits: diffs data-gen's latest snapshot against the previous delta's target and writes the
     # changes to the delta-data volume. Not started by `up`; run it with `docker compose run --rm delta-job`
     # (add --verify to check against data-gen's expected delta, or --full to send the whole audience).
     profiles: [job]
     image: ${IMAGE_REGISTRY:-ghcr.io/theluismedina/activation}/delta-job:${IMAGE_TAG:-latest}
     environment:
       DELTAJOB_AUDIENCES_DIR: /data/audiences
       DELTAJOB_OUTPUT_DIR: /deltas
     volumes:
       # Same mount point as data-gen, so paths in manifest.json resolve identically. Read-only: data-gen owns it.
       - audience-data:/data:ro
       - delta-data:/deltas

   # The services below have no published images yet, so they only start with `--profile wip`
   # (after building them locally).

   workflow:
     profiles: [wip]
     image: synapstream/activation/workflow:latest

   mock-platforms:
     profiles: [wip]
     image: synapstream/activation/mock:latest

volumes:
   # Audience snapshots, expected deltas, manifest.json and the saved schedule, written by data-gen.
   audience-data:
   # One directory per delta (changes.parquet + manifest.json), written by delta-job, read by the workflow.
   delta-data:
